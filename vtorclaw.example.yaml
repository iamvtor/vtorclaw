# vtorclaw.yaml — Declarative spec for your OpenClaw VM
# Edit this file, then run the launcher.
# This is the single source of truth for VM resources + OpenClaw configuration + secrets.

vm:
  name: openclaw
  # RAM is configurable (default 8G as requested). Use G or M suffix.
  memory: "8G"
  cpus: 2
  disk: "30G"
  # Ubuntu release used by Multipass
  ubuntu: "24.04"

openclaw:
  # stable | beta | main (or a specific version tag)
  channel: "stable"

  # This entire block is used to generate the openclaw.json inside the VM.
  # The launcher merges it with secure defaults (strong token, pairing policies,
  # sandbox + browser enabled, per-channel-peer sessions, etc.).
  # Edit this for fully declarative configuration.
  config:
    gateway:
      bind: "loopback"   # "loopback" | "tailscale" (once joined)

    agents:
      defaults:
        sandbox:
          mode: "non-main"      # "off" | "non-main" | "all" — "non-main" is recommended default
          backend: "docker"
          scope: "session"
          workspaceAccess: "rw"
          browser:
            autoStart: true
            # You can add more browser hardening here:
            # network: "none" or a custom bridge, cdpSourceRange, etc.

    tools:
      profile: "messaging"      # Start restrictive. Expand only as needed.
      # Example tighter policy:
      # deny: ["group:automation", "exec", "browser"]  # for non-browser agents

    # Model providers — fully declarative.
    # Strongly recommended: Run LiteLLM inside the VM as a unified OpenAI-compatible proxy.
    # This lets you easily mix:
    # - Free-tier Google account (for free Gemini models/quotas)
    # - X Premium+ (Grok via native OAuth or API key if available)
    # - NVIDIA free models, etc.
    # without changing much in OpenClaw.
    # See README for LiteLLM setup instructions + config.
    models:
      providers:
        # Point OpenClaw at local LiteLLM proxy (recommended)
        openai:
          apiBase: "http://127.0.0.1:4000"   # LiteLLM default
          apiKey:
            source: "env"
            provider: "default"
            id: "LITELLM_MASTER_KEY"   # or just use a dummy if no auth

    # Default model — use LiteLLM naming (provider/model)
    # For free Google account: google/gemini-2.0-flash (free quotas)
    # For X Premium+: xai/grok-3 (via native OAuth) or through LiteLLM
    # NVIDIA free tier example: nvidia_nim/meta/llama-3.1-8b-instruct
    agent:
      model: "google/gemini-2.0-flash"   # free-tier from separate Google account

    # The launcher will always inject a strong random gateway token.

secrets:
  # Path to a local YAML/JSON file containing secrets.
  # Supported keys (examples): ANTHROPIC_API_KEY, OPENAI_API_KEY, TELEGRAM_BOT_TOKEN, etc.
  # These are written into the VM during provisioning (never committed if you .gitignore the real file).
  file: "secrets.yaml"

  # You can also put a few inline here for testing (not recommended for real secrets).
  # inline:
  #   ANTHROPIC_API_KEY: "sk-ant-..."

tailscale:
  # Optional: provide a Tailscale auth key (reusable or one-time) for zero-touch
  # networking inside the VM. Highly recommended for easy access to the Control UI
  # and CLI from your Windows machine without port forwards.
  auth_key: ""

  # If set, the VM will auto-join your tailnet and you can reach it as openclaw.<name>.ts.net
  # (or whatever hostname you configure).

# Future: you can add sections for additional declarative behavior
# (e.g. pre-installed skills, custom sandbox image builds, monitoring, etc.)
