# secrets.example.yaml
# Copy to secrets.yaml (gitignored) and fill real values.
# These become environment variables available to the openclaw service inside the VM.

# REQUIRED for your setup: free-tier Google account (separate from any paid AI Pro)
# Get it at https://aistudio.google.com/app/apikey while logged into the free account.
# This gives real free Gemini quotas (gemini-2.0-flash etc.).
GOOGLE_API_KEY: "AIzaSyYourFreeAccountKeyHere..."

# For Grok / xAI with X Premium+:
# Preferred: do native OAuth inside the VM after first boot (no key needed in secrets).
# Only fill this if you obtained a real XAI_API_KEY from a paid plan / SuperGrok.
# XAI_API_KEY: "xai-..."

# Optional (NVIDIA NIM free/low-cost models)
# NVIDIA_API_KEY: "nvapi-..."

# Other channels / tools as needed (never commit the real secrets.yaml)
# TELEGRAM_BOT_TOKEN: "..."
# etc.
