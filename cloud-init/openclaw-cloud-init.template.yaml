#cloud-config
# This is a reference / standalone template.
# The real launches are driven by scripts/launch.ps1 which renders a customized
# version from your declarative vtorclaw.yaml (including generated tokens,
# injected secrets, Tailscale key, etc.).
#
# You can use this template directly with `multipass launch --cloud-init ...`
# if you manually fill in the placeholders.

users:
  - name: openclaw
    gecos: "OpenClaw Gateway"
    system: true
    shell: /bin/bash
    lock_passwd: true
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    groups: [docker]

package_update: true
packages:
  - docker.io
  - curl
  - jq
  - ca-certificates

write_files:
  - path: /etc/systemd/system/openclaw-gateway.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=OpenClaw Gateway (dedicated user)
      After=network-online.target docker.service
      Wants=network-online.target
      Requires=docker.service

      [Service]
      Type=simple
      User=openclaw
      Group=openclaw
      WorkingDirectory=/home/openclaw
      Environment=OPENCLAW_GATEWAY_TOKEN=PUT_YOUR_STRONG_TOKEN_HERE
      # Add provider keys / bot tokens as additional Environment= lines
      ExecStart=/home/openclaw/.openclaw/bin/openclaw gateway run
      Restart=on-failure
      RestartSec=5s

      ProtectSystem=strict
      ProtectHome=read-only
      PrivateTmp=true
      NoNewPrivileges=true

      [Install]
      WantedBy=multi-user.target

  - path: /home/openclaw/.openclaw/openclaw.json
    owner: openclaw:openclaw
    permissions: "0600"
    content: |
      {
        "gateway": {
          "mode": "local",
          "bind": "loopback",
          "auth": { "mode": "token", "token": "PUT_YOUR_STRONG_TOKEN_HERE" }
        },
        "agents": {
          "defaults": {
            "sandbox": {
              "mode": "non-main",
              "backend": "docker",
              "browser": { "autoStart": true }
            }
          }
        }
      }

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker openclaw

  - sudo -u openclaw bash -c 'curl -fsSL https://openclaw.ai/install.sh | bash -s -- --no-onboard'

  - ln -sf /home/openclaw/.openclaw/bin/openclaw /usr/local/bin/openclaw || true

  # Pre-build sandbox images (required for browser tools)
  - sudo -u openclaw bash -c 'docker build -t openclaw-sandbox:bookworm-slim - << "DOCKERFILE"
FROM debian:bookworm-slim
ENV DEBIAN_FRONTEND=noninteractive
RUN apt-get update && apt-get install -y --no-install-recommends \
    bash ca-certificates curl git jq python3 ripgrep \
    && rm -rf /var/lib/apt/lists/*
RUN useradd --create-home --shell /bin/bash sandbox
USER sandbox
WORKDIR /home/sandbox
CMD ["sleep", "infinity"]
DOCKERFILE'

  - sudo -u openclaw bash -c 'docker build -t openclaw-sandbox-browser:bookworm-slim - << "DOCKERFILE"
FROM mcr.microsoft.com/playwright:v1.44.0-jammy
RUN apt-get update && apt-get install -y --no-install-recommends tini && rm -rf /var/lib/apt/lists/*
ENTRYPOINT ["/usr/bin/tini", "--"]
CMD ["sleep", "infinity"]
DOCKERFILE'

  - chown -R openclaw:openclaw /home/openclaw || true

  - systemctl daemon-reload
  - systemctl enable --now openclaw-gateway.service

  # Optional Tailscale block would be inserted here by the launcher when a key is provided.

final_message: |
  OpenClaw VM provisioned with dedicated user + Docker sandboxes (browser tools enabled).

  multipass shell <name>
  sudo -u openclaw openclaw gateway status
